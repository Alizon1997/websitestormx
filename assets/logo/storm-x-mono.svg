<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 420" role="img" aria-label="Storm X Digital">
  <title>Storm X Digital</title>
  <!-- STORM — serif italic, bianco caldo per footer scuro -->
  <text
    x="20" y="310"
    font-family="'Instrument Serif', 'Playfair Display', Georgia, 'Times New Roman', serif"
    font-style="italic"
    font-weight="400"
    font-size="320"
    fill="#F8F7F4"
    letter-spacing="-0.005em">STORM</text>
  <!-- X — orange resta, anche su scuro -->
  <text
    x="1100" y="335"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="380"
    fill="#FF5500"
    letter-spacing="-0.04em">X</text>
  <!-- DIGITAL — micro-mono in bianco caldo -->
  <text
    x="1380" y="265"
    font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace"
    font-weight="500"
    font-size="74"
    fill="#F8F7F4"
    letter-spacing="0.18em">DIGITAL</text>
</svg>
